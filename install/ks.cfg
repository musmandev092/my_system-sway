text
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts=us
network --bootproto=dhcp --activate
firstboot --disable
selinux --enforcing
firewall --enabled
rootpw --lock

url --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64&protocol=https"
repo --name=fedora-updates --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64&protocol=https" --excludepkgs=quickshell,danksearch,dgop,matugen
repo --name=rpmfusion-free --mirrorlist="https://mirrors.rpmfusion.org/mirrorlist?repo=free-fedora-44&arch=x86_64"
repo --name=rpmfusion-free-updates --mirrorlist="https://mirrors.rpmfusion.org/mirrorlist?repo=free-fedora-updates-released-44&arch=x86_64"
repo --name=rpmfusion-nonfree --mirrorlist="https://mirrors.rpmfusion.org/mirrorlist?repo=nonfree-fedora-44&arch=x86_64"
repo --name=rpmfusion-nonfree-updates --mirrorlist="https://mirrors.rpmfusion.org/mirrorlist?repo=nonfree-fedora-updates-released-44&arch=x86_64"
repo --name=brave-browser --baseurl=https://brave-browser-rpm-release.s3.brave.com/x86_64
repo --name=microsoft-edge --baseurl=https://packages.microsoft.com/yumrepos/edge
repo --name=dms --baseurl=https://download.copr.fedorainfracloud.org/results/avengemedia/dms/fedora-44-x86_64/
repo --name=danklinux --baseurl=https://download.copr.fedorainfracloud.org/results/avengemedia/danklinux/fedora-44-x86_64/
repo --name=claude-desktop --baseurl=https://musmandev092.github.io/claude-desktop-rpm/repo

%include /tmp/ks-machine.cfg

%pre --interpreter=/usr/bin/bash --erroronfail --log=/tmp/ks-pre.log
set -u
FEDORA_DISK=/dev/disk/by-id/nvme-MTFDKBA1T0TFH-1BC1AABHA_UMDMD01J1GBK6Z
OUT=/tmp/ks-machine.cfg
VM=0
case "$(systemd-detect-virt 2>/dev/null || true)" in ""|none) ;; *) VM=1 ;; esac
if grep -q "console=ttyS0" /proc/cmdline; then TTY=/dev/ttyS1
else
    TTY=/dev/tty8
    for t in /dev/tty8 /dev/tty1; do setfont -C "$t" latarcyrheb-sun32 2>/dev/null || true; done
    chvt 8
fi
exec 3<>"$TTY"

out()  { printf '%s\n' "$*" >&3; }
hdr()  { out ""; out "=== $* ==="; }
stop() { out ""; out "INSTALL STOPPED: $*"; out "Nothing was written to any disk. Power off and boot again to retry."; sleep 30; exit 1; }
ask() {    # ask VAR "question" "default" "regex"
    local v=$1 q=$2 d=$3 re=$4 a
    while :; do
        if [ -n "$d" ]; then printf '  %s [%s]: ' "$q" "$d" >&3; else printf '  %s: ' "$q" >&3; fi
        IFS= read -r -u 3 a; a=${a:-$d}
        if [[ "$a" =~ $re ]]; then printf -v "$v" '%s' "$a"; return; fi
        out "    not valid, try again"
    done
}
secret() { # secret VAR "question" MINLEN   (hidden, typed twice)
    local v=$1 q=$2 n=$3 a b
    while :; do
        printf '  %s: ' "$q" >&3; IFS= read -r -s -u 3 a; out ""
        if [ "${#a}" -lt "$n" ]; then out "    at least $n characters"; continue; fi
        case "$a" in *\"*|*\\*) out "    please do not use \" or \\"; continue ;; esac
        printf '  %s (again): ' "$q" >&3; IFS= read -r -s -u 3 b; out ""
        if [ "$a" = "$b" ]; then printf -v "$v" '%s' "$a"; return; fi
        out "    they do not match, try again"
    done
}
yes_no() { local a; printf '  %s [%s]: ' "$1" "$2" >&3; IFS= read -r -u 3 a; a=${a:-$2}; [[ "$a" =~ ^[Yy] ]]; }
online() { curl -fsS -o /dev/null --max-time 8 https://mirrors.fedoraproject.org/ 2>/dev/null; }

out ""
out "#############################################################"
out "#   my_system installer: Fedora 44 + sway + Dank Material   #"
out "#############################################################"

hdr "1. Internet"
if online; then
    out "  Connected."
else
    while ! online; do
        out "  No internet. Connect to Wi-Fi (or plug in a cable and press Enter)."
        nmcli dev wifi rescan >/dev/null 2>&1; sleep 4
        mapfile -t nets < <(nmcli -t -f SSID dev wifi list 2>/dev/null | grep -v '^$' | awk '!s[$0]++' | head -15)
        i=1; for n in "${nets[@]}"; do out "    $i) $n"; i=$((i+1)); done
        out "    h) hidden network      Enter) check again"
        ask pick "Wi-Fi network" "" '^([0-9]+|h|)$'
        [ -z "$pick" ] && continue
        hidden=no
        if [ "$pick" = h ]; then ask ssid "Network name (SSID)" "" '^.+$'; hidden=yes
        elif [ "$pick" -ge 1 ] && [ "$pick" -le "${#nets[@]}" ]; then ssid=${nets[$((pick-1))]}
        else out "    no such number"; continue; fi
        printf '  Wi-Fi password for "%s": ' "$ssid" >&3; IFS= read -r -s -u 3 wpw; out ""
        if nmcli dev wifi connect "$ssid" password "$wpw" hidden "$hidden" >/dev/null 2>&1; then
            sleep 3; out "  Connected to $ssid."
        else
            out "  Could not connect to $ssid (wrong password?)."
        fi
    done
fi

hdr "2. This computer"
ask hostname "Computer name (letters, digits, -)" "USAY-Linux" '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$'
while :; do
    ask tz "Time zone" "Asia/Karachi" '^[A-Za-z_]+(/[A-Za-z0-9_+-]+)*$'
    [ -f "/usr/share/zoneinfo/$tz" ] && break
    out "    unknown time zone (examples: Asia/Karachi, Europe/London, UTC)"
done

hdr "3. Your account (administrator)"
ask fullname "Full name" "Muhammad Usman" '^[^":\\]+$'
ask username "Username" "musmandev092" '^[a-z_][a-z0-9_-]{0,31}$'
secret password "Password" 4

hdr "4. Disk encryption (asked at every power-on)"
if yes_no "Use the same password as your account?" "Y"; then
    luks=$password
else
    secret luks "Disk password" 4
fi

hdr "5. Disk (it will be erased)"
mapfile -t disks < <(lsblk -dnpo NAME,TYPE,TRAN,RM | awk '$2 == "disk" && $3 != "usb" && $4 == 0 {print $1}' | grep -v zram)
[ "${#disks[@]}" -gt 0 ] || stop "no internal disk found."
fedora_dev=$(readlink -f "$FEDORA_DISK" 2>/dev/null || true)
def=1
for i in "${!disks[@]}"; do
    d=${disks[$i]}
    model=$(lsblk -dno MODEL "$d" | sed 's/ *$//'); size=$(lsblk -dno SIZE "$d" | tr -d ' ')
    fs=$(lsblk -no FSTYPE "$d" | grep -v '^$' | sort -u | tr '\n' ' ')
    tag=""
    [ "$d" = "$fedora_dev" ] && { tag="  <- Fedora disk"; def=$((i + 1)); }
    if lsblk -no FSTYPE "$d" | grep -q ntfs || lsblk -no PARTLABEL "$d" | grep -qi microsoft; then tag="  !! WINDOWS !!"; fi
    out "    $((i + 1))) $d  $model  $size  [${fs:-empty}]$tag"
done
ask pick "Install on disk number" "$def" '^[0-9]+$'
[ "$pick" -ge 1 ] && [ "$pick" -le "${#disks[@]}" ] || stop "no such disk number."
disk=${disks[$((pick - 1))]}
if lsblk -no FSTYPE "$disk" | grep -q ntfs; then
    out ""; out "  !! This disk has WINDOWS on it. Windows and its files will be DELETED. !!"
fi
out ""; lsblk -o NAME,MODEL,SERIAL,SIZE,FSTYPE "$disk" | sed 's/^/    /' >&3
ask wipe "Type WIPE to erase $disk" "" '^.*$'
[ "$wipe" = WIPE ] || stop "you did not type WIPE."

hdr "Summary"
out "  Computer : $hostname ($tz)"
out "  Account  : $fullname ($username), administrator"
out "  Disk     : $disk, erased, encrypted (LUKS2) + btrfs"
out "  Then     : about 1,065 packages (about 2 GiB) from the internet, system setup, restart."
out "            Your personal setup finishes by itself on the first login."
ask go "Install now? (yes/no)" "" '^(yes|no)$'
[ "$go" = yes ] || stop "cancelled."

hash=$(printf '%s' "$password" | openssl passwd -6 -stdin 2>/dev/null)
if [[ "$hash" == \$6\$* ]]; then userpw="--password=$hash --iscrypted"
else userpw="--password=\"$password\" --plaintext"; fi
{
    echo "network --hostname=$hostname"
    echo "timezone $tz --utc"
    echo "ignoredisk --only-use=$disk"
    echo "zerombr"
    echo "clearpart --all --initlabel --drives=$disk"
    echo "autopart --type=btrfs --encrypted --passphrase=\"$luks\""
    echo "user --name=$username --gecos=\"$fullname\" --groups=wheel $userpw"
    nv='rd.driver.blacklist=nouveau,nova_core modprobe.blacklist=nouveau,nova_core nvidia-drm.modeset=1 nvidia-drm.fbdev=1'
    if [ "$VM" = 1 ]; then echo "bootloader --append=\"fbcon=font:TER16x32 $nv console=tty0 console=ttyS0,115200\""
    else echo "bootloader --append=\"fbcon=font:TER16x32 $nv\""; fi
    echo "reboot --eject"
} > "$OUT"
chmod 600 "$OUT"
echo "$username" > /tmp/ks-user
out ""; out "  Installing. This takes about 20 minutes; the screen switches to the installer now."
sleep 3
[ "$TTY" = /dev/tty8 ] && chvt 1
echo "answers collected for $username on $disk (vm=$VM)"
%end

%packages --exclude-weakdeps
@core
kernel
kernel-modules-extra
grub2-efi-x64
shim-x64
grub2-tools
efibootmgr
os-prober
cryptsetup
btrfs-progs
zram-generator-defaults
glibc-langpack-en
NetworkManager-wifi
systemd-pam
rpmfusion-free-release
rpmfusion-nonfree-release

linux-firmware
iwlwifi-mvm-firmware
intel-gpu-firmware
intel-audio-firmware
alsa-sof-firmware
microcode_ctl

mesa-dri-drivers
mesa-vulkan-drivers
intel-media-driver

akmod-nvidia
kernel-devel
xorg-x11-drv-nvidia-cuda
xorg-x11-drv-nvidia-power

pipewire
pipewire-pulseaudio
pipewire-alsa
wireplumber
alsa-ucm

bluez
bolt
iio-sensor-proxy
tuned-ppd
upower
fwupd

cups
system-config-printer

sway
sway-config-minimal
sway-systemd
swaybg
grim
grimshot
slurp
brightnessctl
pulseaudio-utils
lxqt-policykit
polkit
xdg-desktop-portal-wlr
xorg-x11-server-Xwayland
dms
matugen
danksearch
qt6-qtmultimedia
greetd
dms-greeter
xdg-desktop-portal-gnome
gnome-keyring
gnome-keyring-pam
lynis

nautilus
sushi
gvfs
gvfs-mtp
gvfs-smb
gvfs-fuse
glycin-thumbnailer
gst-thumbnailers
udisks2
dosfstools
exfatprogs
ntfs-3g
file-roller
papers
loupe
gnome-text-editor
ptyxis
gnome-calculator
snapshot
gnome-clocks
gnome-font-viewer
gnome-disk-utility
showtime
seahorse
gnome-characters
adw-gtk3-theme
xdg-user-dirs
wl-clipboard
swappy
google-noto-sans-fonts
google-noto-emoji-fonts

fastfetch
tar
rsync
git-core
brave-origin
chromium
microsoft-edge-stable
toolbox
claude-desktop
%end

%post --nochroot --interpreter=/usr/bin/bash --log=/mnt/sysroot/root/ks-post-nochroot.log
set -x
S=/mnt/sysroot
cp /tmp/ks-user "$S/root/ks-user"
for f in /etc/NetworkManager/system-connections/*.nmconnection; do
    [ -f "$f" ] && install -m 600 "$f" "$S/etc/NetworkManager/system-connections/"
done
u=$(cat /tmp/ks-user)
src=""
for m in /run/install/repo /run/install/sources/* /run/install/isodir; do
    [ -d "$m/my_system" ] && { src="$m/my_system"; break; }
done
if [ -z "$src" ]; then
    dev=$(blkid -L Fedora-E-dvd-x86_64-44 2>/dev/null || true)
    mkdir -p /mnt/msiso
    [ -n "$dev" ] && mount -o ro "$dev" /mnt/msiso && [ -d /mnt/msiso/my_system ] && src=/mnt/msiso/my_system
fi
if [ -n "$src" ]; then
    mkdir -p "$S/home/$u/Projects" && cp -a "$src" "$S/home/$u/Projects/my_system"
    echo "my_system copied from $src"
else
    echo "WARNING: my_system not found on the install media"
fi
mountpoint -q /mnt/msiso && umount /mnt/msiso
sed -i '/--passphrase/d' "$S/root/anaconda-ks.cfg" 2>/dev/null || true
%end

%post --interpreter=/usr/bin/bash --log=/root/ks-post.log
set -x

cat > /etc/yum.repos.d/brave-browser.repo <<'EOF'
[brave-browser]
name=Brave Browser
baseurl=https://brave-browser-rpm-release.s3.brave.com/$basearch
enabled=1
gpgcheck=1
gpgkey=https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
EOF
cat > /etc/yum.repos.d/microsoft-edge.repo <<'EOF'
[microsoft-edge]
name=Microsoft Edge
baseurl=https://packages.microsoft.com/yumrepos/edge
enabled=1
gpgcheck=1
gpgkey=https://packages.microsoft.com/keys/microsoft.asc
EOF
for c in dms danklinux; do
cat > "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:avengemedia:$c.repo" <<EOF
[copr:copr.fedorainfracloud.org:avengemedia:$c]
name=Copr repo for $c owned by avengemedia
baseurl=https://download.copr.fedorainfracloud.org/results/avengemedia/$c/fedora-\$releasever-\$basearch/
type=rpm-md
gpgcheck=1
gpgkey=https://download.copr.fedorainfracloud.org/results/avengemedia/$c/pubkey.gpg
repo_gpgcheck=0
enabled=1
enabled_metadata=1
EOF
done
curl -fsS -o /etc/yum.repos.d/claude-desktop.repo https://musmandev092.github.io/claude-desktop-rpm/claude-desktop.repo

rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-*-fedora-44 || true
for k in https://brave-browser-rpm-release.s3.brave.com/brave-core.asc \
         https://packages.microsoft.com/keys/microsoft.asc \
         https://download.copr.fedorainfracloud.org/results/avengemedia/dms/pubkey.gpg \
         https://download.copr.fedorainfracloud.org/results/avengemedia/danklinux/pubkey.gpg \
         https://musmandev092.github.io/claude-desktop-rpm/RPM-GPG-KEY-claude-desktop-rpm.asc; do
    rpm --import "$k" || echo "WARNING: could not import $k"
done
rpm -qa --qf '%{NAME}\t%{SIGPGP:pgpsig}|%{RSAHEADER:pgpsig}|%{OPENPGP:pgpsig}\n' 2>/dev/null \
    | awk -F'\t' '$2 == "(none)|(none)|(none)" && $1 !~ /^gpg-pubkey/' > /root/unsigned-packages.txt || true

DMS_OWN="quickshell,danksearch,dgop,matugen"
mkdir -p /etc/dnf/repos.override.d
cat > /etc/dnf/repos.override.d/50-dms-copr.repo <<EOF
[fedora]
excludepkgs=$DMS_OWN
[updates]
excludepkgs=$DMS_OWN
[updates-testing]
excludepkgs=$DMS_OWN
EOF
dnf -y --setopt=allow_vendor_change=True --setopt=install_weak_deps=False upgrade ${DMS_OWN//,/ }
rpm -q ${DMS_OWN//,/ }
rpm -q quickshell | grep -q '^quickshell-0\.[3-9]' || echo "WARNING: quickshell is still too old for DMS 2.x"

dnf -y --setopt=install_weak_deps=False upgrade --refresh
echo "pending updates after install: $(dnf -q check-upgrade 2>/dev/null | grep -cE '\.(x86_64|noarch)')"

for k in $(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core); do
    akmods --force --kernels "$k" || echo "WARNING: NVIDIA module build failed for $k (akmods retries at boot)"
done

dms-greeter enable || true
systemctl enable greetd.service
systemctl set-default graphical.target
# Sway 1.12 + wlroots 0.20 are not in Fedora 44 yet: use the signed musmandev092/sway-rpm repo,
# or the copies shipped with my_system when there is no network.
u=$(cat /root/ks-user 2>/dev/null)
R=/home/$u/Projects/my_system
install -m 0644 "$R/etc/yum.repos.d/sway-rpm.repo" /etc/yum.repos.d/sway-rpm.repo
rpm --import "$R/install/rpms/RPM-GPG-KEY-sway-rpm.asc"
dnf -y --setopt=install_weak_deps=False install sway wlroots sway-config-minimal \
    || dnf -y --setopt=install_weak_deps=False install "$R"/install/rpms/*.rpm \
    || echo "WARNING: sway 1.12 not installed"
# Fedora's own sway 1.11 is already installed from %packages, and install alone would keep it
dnf -y --setopt=install_weak_deps=False upgrade sway wlroots sway-config-minimal || echo "WARNING: sway upgrade to 1.12 failed"
sed -i -e 's/--command niri/--command sway/' -e 's# -C /etc/greetd/niri/config.kdl##' /etc/greetd/config.toml

sed -i '/^GRUB_DISABLE_OS_PROBER=/d' /etc/default/grub
echo 'GRUB_DISABLE_OS_PROBER=false' >> /etc/default/grub
grub2-mkconfig -o /boot/grub2/grub.cfg
grep -i -m1 "menuentry 'Windows" /boot/grub2/grub.cfg || echo "note: no Windows found by os-prober"

u=$(cat /root/ks-user 2>/dev/null)
M=/home/$u/Projects/my_system
if [ -n "$u" ] && [ -x "$M/apply.sh" ]; then
    chown -R "$u:$u" "/home/$u/Projects"
    "$M/apply.sh" system
    unit=/home/$u/.config/systemd/user
    mkdir -p "$unit/default.target.wants"
    cp "$M/install/my-system-firstrun.service" "$unit/"
    ln -sf ../my-system-firstrun.service "$unit/default.target.wants/my-system-firstrun.service"
    chown -R "$u:$u" "/home/$u/.config"
else
    echo "WARNING: no my_system for '$u': run apply.sh by hand after the first login"
fi

if [ -f /usr/lib/kbd/consolefonts/latarcyrheb-sun32.psfu.gz ]; then
    sed -i '/^FONT=/d' /etc/vconsole.conf 2>/dev/null; echo 'FONT=latarcyrheb-sun32' >> /etc/vconsole.conf
fi

echo "my_system install finished: $(date -Is)" > /root/ks-done
%end
