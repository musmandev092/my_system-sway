# Windows 11 style switchers (DMS plugin "Switcher", home/.config/dms/plugins/Switcher).
#   Alt+Tab    windows of this workspace with previews; hold Alt, press Tab to move, release Alt to switch.
#   Super+Tab  every workspace with previews of its windows; arrows move, Return or a click switches, Esc cancels.

bindsym Mod1+Tab exec dms ipc call switcher open windows; mode "switcher"
bindsym Mod1+Shift+Tab exec dms ipc call switcher open windows; mode "switcher"

mode "switcher" {
    bindsym Mod1+Tab exec dms ipc call switcher next
    bindsym Mod1+Shift+Tab exec dms ipc call switcher prev
    bindsym Right exec dms ipc call switcher next
    bindsym Left exec dms ipc call switcher prev
    bindsym Return exec dms ipc call switcher commit; mode "default"
    bindsym --release Alt_L exec dms ipc call switcher commit; mode "default"
    bindsym --release Alt_R exec dms ipc call switcher commit; mode "default"
    bindsym Escape exec dms ipc call switcher cancel; mode "default"
}

bindsym $mod+Tab exec dms ipc call switcher open overview; mode "overview"

mode "overview" {
    bindsym $mod+Tab exec dms ipc call switcher next
    bindsym Tab exec dms ipc call switcher next
    bindsym Shift+Tab exec dms ipc call switcher prev
    bindsym Right exec dms ipc call switcher next
    bindsym Left exec dms ipc call switcher prev
    bindsym Down exec dms ipc call switcher down
    bindsym Up exec dms ipc call switcher up
    bindsym Return exec dms ipc call switcher commit; mode "default"
    bindsym Escape exec dms ipc call switcher cancel; mode "default"
}

# Super+/ : every shortcut (Fedora spin + DMS + yours). Type to search, Up/Down + Enter or a click runs it, Esc closes.
bindsym --no-warn $mod+slash exec dms ipc call switcher open keys
