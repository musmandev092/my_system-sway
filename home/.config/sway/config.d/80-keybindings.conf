# Your FedoraDesk bindings, with the rofi menus replaced by DMS.
bindsym --no-warn $mod+Shift+s exec $HOME/.local/bin/screenshot-notify

bindsym --no-warn $mod+Ctrl+Right workspace next
bindsym --no-warn $mod+Ctrl+Left workspace prev
bindsym --no-warn --whole-window $mod+button5 workspace next
bindsym --no-warn --whole-window $mod+button4 workspace prev
bindgesture swipe:3:right workspace next
bindgesture swipe:3:left workspace prev
bindgesture swipe:4:right focus next
bindgesture swipe:4:left focus prev

bindsym --no-warn --locked XF86MonBrightnessUp exec dms ipc call brightness increment 5 ""
bindsym --no-warn --locked XF86MonBrightnessDown exec dms ipc call brightness decrement 5 ""
