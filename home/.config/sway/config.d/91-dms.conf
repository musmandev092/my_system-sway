# DMS is the shell: bar, launcher, notifications, clipboard, lock screen and login screen.
# The login screen does not start it, so Sway does. TERMINAL tells DMS how to open 'run in terminal' apps (btop...).
exec env TERMINAL="$HOME/.local/bin/ptyxis-e" dms run

bindsym --no-warn $mod+comma exec dms ipc call settings focusOrToggle
bindsym --no-warn $mod+z exec dms ipc call openHere toggle

# GNOME apps stay (Ptyxis, Nautilus). The Fedora spin bindings are otherwise untouched.
bindsym --no-warn XF86Calculator exec gnome-calculator

for_window [app_id="org.gnome.NautilusPreviewer"] floating enable
for_window [app_id="^open-with$"] floating enable, resize set 640 520

# Volume, mic and media keys go through DMS (on-screen display); brightness is in 80-keybindings.conf.
bindsym --no-warn --locked {
    XF86AudioRaiseVolume exec dms ipc call audio increment 3
    XF86AudioLowerVolume exec dms ipc call audio decrement 3
    XF86AudioMute exec dms ipc call audio mute
    XF86AudioMicMute exec dms ipc call audio micmute
    XF86AudioPlay exec dms ipc call mpris playPause
    XF86AudioPause exec dms ipc call mpris playPause
    XF86AudioNext exec dms ipc call mpris next
    XF86AudioPrev exec dms ipc call mpris previous
}

# DMS default keys (the ones that do not clash with the Fedora spin keys).
bindsym --no-warn $mod+x exec dms ipc call powermenu toggle
bindsym --no-warn $mod+Alt+n exec dms ipc call night toggle
bindsym --no-warn $mod+y exec dms ipc call dash toggle wallpaper

# Clipboard takes Super+v (DMS default); the vertical split moved to Super+Shift+v in the main config.
bindsym --no-warn $mod+v exec dms ipc call clipboard toggle

# More DMS default keys (chosen one by one).
bindsym --no-warn $mod+Alt+l exec dms ipc call lock lock
bindsym --no-warn $mod+m exec dms ipc call dash toggle media
bindsym --no-warn $mod+n exec dms ipc call notepad toggle
bindsym --no-warn $mod+Shift+n exec dms ipc call notepad toggleExpand
bindsym --no-warn $mod+Ctrl+n exec dms ipc call notifications toggle
bindsym --no-warn $mod+Alt+i exec dms ipc call inhibit toggle
bindsym --no-warn $mod+p exec dms ipc outputs cycleProfile
bindsym --no-warn Ctrl+Alt+Delete exec dms ipc call processlist focusOrToggle
bindsym --no-warn Ctrl+Alt+m exec dms ipc call processlist focusOrToggle
bindsym --no-warn Alt+space exec dms ipc call spotlight-bar toggle
bindsym --no-warn $mod+Alt+c exec dms ipc call color-picker toggle
