# Keep title bars and use gaps only between windows.
default_border normal 1
default_floating_border normal 1
titlebar_padding 8 4
titlebar_border_thickness 1
font pango:Adwaita Sans 10
gaps inner 4
gaps outer 0
smart_gaps on
smart_borders on

client.focused          #89b4fa #89b4fa #11111b #b4befe #89b4fa
client.focused_inactive #313244 #313244 #cdd6f4 #45475a #313244
client.unfocused        #1e1e2e #1e1e2e #a6adc8 #313244 #1e1e2e
client.urgent           #f38ba8 #f38ba8 #11111b #f38ba8 #f38ba8
